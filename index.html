<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#F4EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Финансы">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231A1815'/><text y='.85em' x='50' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-weight='400' font-size='68' fill='%23F4F1EA'>₽</text</svg>">
<title>Финансы — Личный учёт</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@300;400;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js</script>
<script>
if (typeof tailwind !== 'undefined') tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        mono: ['"JetBrains Mono"', 'ui-monospace', 'Menlo', 'monospace'],
        display: ['"Major Mono Display"', '"JetBrains Mono"', 'monospace'],
        crt: ['VT323', '"JetBrains Mono"', 'monospace'],
      },
      colors: {
        term: { DEFAULT: '#F4EFE6', grid: '#1A1A1A', line: '#2A2A2A' },
        amber: { DEFAULT: '#4A4339', dim: '#7A6F5F', bright: '#2B2520' },
        mint: { DEFAULT: '#5B7553' },
        crimson: { DEFAULT: '#C45A2D' },
        income: '#5B7553',
        expense: '#C45A2D',
      }
    }
  }
};
</script>
<style>
/* =========================================================
     FINANCE — NOTEBOOK
     Personal Moleskine · kraft paper · hand-drawn · intimate
     ========================================================= */
  :root {
    /* Surfaces */
    --paper:        #F4EFE6;
    --paper-2:      #EDE6D6;
    --paper-3:      #E0D7C0;
    --cream:        #FFFCF5;
    --cream-2:      #FAF6EC;
    --line:         #C9BFA8;
    --line-2:       #B0A690;
    --line-3:       #8A8070;

    /* Ink */
    --ink:          #2B2520;
    --ink-2:        #4A4339;
    --ink-3:        #7A6F5F;
    --ink-4:        #A89B85;

    /* Accents */
    --terracotta:   #C45A2D;
    --terracotta-2: #A04A24;
    --terracotta-soft: #F2DACE;
    --sage:         #5B7553;
    --sage-2:       #4A6346;
    --sage-soft:    #DEE5D6;
    --amber:        #B47B2C;
    --amber-soft:   #F0E2C5;

    /* Type */
    --font-hand:    'Kalam', 'Caveat', cursive;
    --font-hand-2:  'Caveat', 'Kalam', cursive;
    --font-sans:    'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, Menlo, monospace;

    /* Shadow — paper-like, not dark */
    --shadow-1: 0 1px 0 rgba(43,37,32,0.04), 0 2px 4px rgba(43,37,32,0.04);
    --shadow-2: 0 1px 0 rgba(43,37,32,0.05), 0 4px 12px rgba(43,37,32,0.06);
    --shadow-3: 0 2px 0 rgba(43,37,32,0.06), 0 8px 24px rgba(43,37,32,0.08);
    --shadow-paper: 0 1px 0 rgba(43,37,32,0.05), 2px 3px 0 rgba(43,37,32,0.04), 4px 6px 12px rgba(43,37,32,0.06);

    /* Radii — slightly rounded, like page corners */
    --r-sm: 4px;
    --r-md: 6px;
    --r-lg: 10px;
  }

  /* ===== RESET ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    margin: 0;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    font-feature-settings: "ss01" 1, "cv11" 1;
    overflow-x: hidden;
    position: relative;
  }
  /* Paper texture overlay — fixed */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/<feColorMatrix values='0 0 0 0 0.17  0 0 0 0 0.14  0 0 0 0 0.12  0 0 0 0.5 0'/</filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
    opacity: 0.55;
    pointer-events: none;
    z-index: 1;
    mix-blend-mode: multiply;
  }
  /* Subtle paper grain on top of cards too */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at top left, rgba(196,90,45,0.04) 0%, transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(91,117,83,0.04) 0%, transparent 50%);
    pointer-events: none;
    z-index: 1;
  }
  ::selection { background: var(--terracotta); color: var(--cream); }

  /* ===== TYPOGRAPHY ===== */
  .hand { font-family: var(--font-hand); font-weight: 700; line-height: 1; }
  .hand-2 { font-family: var(--font-hand-2); font-weight: 600; line-height: 1; }
  .num-mono {
    font-family: var(--font-mono);
    font-feature-settings: "tnum" 1, "zero" 1;
    letter-spacing: -0.02em;
  }
  .label {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-3);
  }
  .label-hand {
    font-family: var(--font-hand);
    font-size: 18px;
    font-weight: 400;
    color: var(--ink-3);
    letter-spacing: 0.01em;
  }
  .ink { color: var(--ink); }
  .ink-2 { color: var(--ink-2); }
  .ink-3 { color: var(--ink-3); }
  .terracotta { color: var(--terracotta); }
  .sage { color: var(--sage); }

  /* ===== LAYOUT ===== */
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 2;
  }
  .stack { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .gap-1 { gap: 4px; } .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; } .gap-6 { gap: 24px; }
  .grow { flex: 1 1 auto; min-width: 0; }
  .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hidden { display: none !important; }
  @media (min-width: 720px) {
    .container { max-width: 720px; padding: 0 32px; }
  }

  /* ===== HEADER ===== */
  .app-header {
    background: rgba(244,239,230,0.88);
    backdrop-filter: saturate(140%) blur(10px);
    -webkit-backdrop-filter: saturate(140%) blur(10px);
    border-bottom: 1px solid var(--line);
    padding: 14px 0;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .brand {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 30px;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .brand em {
    font-style: italic;
    color: var(--terracotta);
    font-family: var(--font-hand-2);
    font-weight: 600;
  }
  .brand-sub {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-4);
    margin-left: 6px;
    padding: 2px 6px;
    border: 1px solid var(--line-2);
    border-radius: 2px;
    transform: rotate(-2deg);
    display: inline-block;
  }
  .header-meta {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-3);
    letter-spacing: 0.02em;
    font-feature-settings: "tnum" 1;
  }
  .header-meta b { color: var(--ink); font-weight: 500; }

  /* ===== CARDS — paper pages ===== */
  .card {
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 18px 20px;
    position: relative;
    box-shadow: var(--shadow-paper);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover {
    transform: translateY(-1px);
    box-shadow: 0 1px 0 rgba(43,37,32,0.06), 3px 4px 0 rgba(43,37,32,0.05), 6px 8px 16px rgba(43,37,32,0.08);
  }
  .card-inset { background: var(--cream-2); }

  /* ===== HERO BALANCE — handwritten ===== */
  .balance {
    padding: 28px 24px 24px;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    position: relative;
    box-shadow: var(--shadow-paper);
    overflow: hidden;
  }
  /* Margin line on left (notebook style) */
  .balance::before {
    content: '';
    position: absolute;
    top: 0;
    left: 36px;
    bottom: 0;
    width: 1px;
    background: rgba(196,90,45,0.18);
    pointer-events: none;
  }
  /* Ruled lines on right (notebook) */
  .balance::after {
    content: '';
    position: absolute;
    inset: 24px 0 24px 60px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0,
      transparent 31px,
      rgba(43,37,32,0.06) 31px,
      rgba(43,37,32,0.06) 32px
    );
    pointer-events: none;
    z-index: 0;
  }
  .balance-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
    position: relative;
    z-index: 1;
  }
  .balance-amount {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: clamp(48px, 14vw, 76px);
    line-height: 0.9;
    letter-spacing: -0.03em;
    color: var(--ink);
    font-feature-settings: "tnum" 1;
    position: relative;
    display: inline-block;
    padding-bottom: 6px;
  }
  /* Hand-drawn underline under hero number */
  .balance-amount::after {
    content: '';
    position: absolute;
    left: -2px;
    right: -2px;
    bottom: -4px;
    height: 8px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 8' preserveAspectRatio='none'><path d='M2 5 Q 25 1, 50 4 T 100 5 T 150 3 T 198 4' stroke='%23C45A2D' stroke-width='2' fill='none' stroke-linecap='round'/</svg>");
    background-repeat: no-repeat;
    background-size: 100% 100%;
    opacity: 0.7;
    pointer-events: none;
  }
  .balance-amount.positive { color: var(--ink); }
  .balance-amount.negative { color: var(--terracotta); }
  .balance-unit {
    font-family: var(--font-hand-2);
    font-weight: 600;
    font-size: 22px;
    color: var(--terracotta);
    margin-left: 4px;
  }
  .balance-meta {
    margin-top: 12px;
    font-family: var(--font-hand-2);
    font-size: 20px;
    color: var(--ink-3);
    letter-spacing: 0.01em;
    position: relative;
    z-index: 1;
  }
  .balance-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px dashed var(--line-2);
    position: relative;
    z-index: 1;
  }
  .stat {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .stat-val {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 18px;
    line-height: 1.1;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum" 1, "zero" 1;
  }
  .stat-val.income { color: var(--sage); }
  .stat-val.expense { color: var(--terracotta); }

  /* ===== MINI STATS ===== */
  .mini-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .mini-stat {
    padding: 14px 16px;
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    position: relative;
    box-shadow: var(--shadow-1);
    transition: all 0.2s ease;
  }
  .mini-stat:hover {
    border-color: var(--line-2);
    transform: translateY(-1px);
    box-shadow: var(--shadow-2);
  }
  .mini-stat-val {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 26px;
    line-height: 1;
    color: var(--ink);
    margin-top: 4px;
    font-feature-settings: "tnum" 1;
  }

  /* ===== CHART CARDS ===== */
  .chart-card {
    background: var(--cream);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    padding: 16px 18px 14px;
    box-shadow: var(--shadow-paper);
    position: relative;
  }
  .chart-card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    gap: 12px;
  }
  .chart-card-title {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 19px;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .chart-card-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .chart-wrap { position: relative; height: 180px; }
  .chart-wrap-tall { height: 220px; }

  /* ===== SECTION HEAD ===== */
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px dashed var(--line-2);
  }
  .section-title {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 32px;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin: 0;
    line-height: 1;
  }
  .section-sub {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* ===== BOTTOM NAV — sticker style ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(244,239,230,0.92);
    backdrop-filter: saturate(160%) blur(14px);
    -webkit-backdrop-filter: saturate(160%) blur(14px);
    border-top: 1px solid var(--line);
    padding: 6px 8px calc(8px + env(safe-area-inset-bottom));
    z-index: 50;
  }
  .bottom-nav-inner {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 2px;
    max-width: 560px;
    margin: 0 auto;
  }
  .nav-pill {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    padding: 8px 4px;
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--r-sm);
    cursor: pointer;
    color: var(--ink-3);
    font-family: var(--font-hand);
    font-size: 14px;
    font-weight: 400;
    letter-spacing: 0.01em;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .nav-pill:hover { color: var(--ink-2); }
  .nav-pill.active {
    color: var(--terracotta);
    background: var(--cream);
    border-color: var(--line);
    transform: rotate(-1deg);
    box-shadow: var(--shadow-1);
  }
  .nav-pill svg { width: 20px; height: 20px; stroke-width: 1.6; }
  .nav-pill .nav-dot {
    display: none;
  }

  /* ===== FAB — washi tape ===== */
  .fab {
    position: fixed;
    bottom: calc(64px + env(safe-area-inset-bottom));
    right: 20px;
    width: 60px;
    height: 60px;
    background: var(--terracotta);
    color: var(--cream);
    border: 2px solid var(--ink);
    border-radius: 50%;
    box-shadow: 3px 4px 0 var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 60;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    transform: rotate(-3deg);
  }
  .fab:hover {
    transform: rotate(0deg) translateY(-2px);
    box-shadow: 4px 6px 0 var(--ink);
  }
  .fab:active {
    transform: rotate(0deg) translate(1px, 2px);
    box-shadow: 2px 3px 0 var(--ink);
  }
  .fab svg { width: 24px; height: 24px; stroke-width: 2; }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 11px 18px;
    border-radius: var(--r-md);
    border: 1.5px solid var(--ink);
    background: var(--ink);
    color: var(--cream);
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: all 0.15s ease;
    box-shadow: 2px 2px 0 var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover {
    background: var(--terracotta);
    border-color: var(--terracotta);
    transform: translate(-1px, -1px);
    box-shadow: 3px 3px 0 var(--ink);
  }
  .btn:active {
    transform: translate(1px, 1px);
    box-shadow: 0 0 0 var(--ink);
  }
  .btn-ghost {
    background: var(--cream);
    color: var(--ink-2);
    border-color: var(--line-2);
    box-shadow: none;
  }
  .btn-ghost:hover {
    background: var(--paper-2);
    color: var(--ink);
    border-color: var(--ink-3);
  }
  .btn-danger {
    background: var(--terracotta);
    border-color: var(--terracotta-2);
  }
  .btn-danger:hover {
    background: var(--terracotta-2);
  }
  .btn-block { width: 100%; padding: 14px 16px; font-size: 14px; }
  .btn-sm { padding: 7px 12px; font-size: 12px; }

  /* ===== FIELDS — paper handwriting style ===== */
  .field-group { display: flex; flex-direction: column; gap: 6px; }
  .field-label {
    font-family: var(--font-hand);
    font-size: 18px;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: 0.01em;
  }
  .input, .select, .textarea {
    width: 100%;
    padding: 12px 14px;
    background: var(--paper);
    border: none;
    border-bottom: 1.5px solid var(--ink-3);
    border-radius: 0;
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .input:focus, .select:focus, .textarea:focus {
    outline: none;
    border-bottom-color: var(--terracotta);
    background: var(--cream-2);
  }
  .input::placeholder { color: var(--ink-4); font-style: italic; }
  .input-amount {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 32px;
    color: var(--ink);
    line-height: 1.1;
    padding: 12px 0 16px;
  }
  .select {
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232B2520' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/</svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    background-size: 18px;
    padding-right: 28px;
  }

  /* ===== TOGGLE — washi paper strip ===== */
  .segmented {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    padding: 4px;
    background: var(--paper-2);
    border: 1.5px dashed var(--ink-3);
    border-radius: var(--r-md);
  }
  .segmented button {
    padding: 10px 12px;
    background: transparent;
    border: none;
    border-radius: var(--r-sm);
    color: var(--ink-3);
    font-family: var(--font-hand);
    font-size: 17px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .segmented button.active.income {
    background: var(--sage-soft);
    color: var(--sage-2);
  }
  .segmented button.active.expense {
    background: var(--terracotta-soft);
    color: var(--terracotta-2);
  }

  /* ===== LIST ITEMS — ruled lines ===== */
  .list { display: flex; flex-direction: column; gap: 0; }
  .list-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    background: transparent;
    border-bottom: 1px dashed var(--line);
    transition: background 0.15s ease;
  }
  .list-item:first-child { padding-top: 4px; }
  .list-item:last-child { border-bottom: none; padding-bottom: 4px; }
  .list-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--paper-2);
    border: 1.5px solid var(--ink-3);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .list-icon.income { background: var(--sage-soft); border-color: var(--sage); }
  .list-icon.expense { background: var(--terracotta-soft); border-color: var(--terracotta); }
  .list-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .list-title {
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  .list-sub {
    font-family: var(--font-hand-2);
    font-size: 16px;
    font-weight: 400;
    color: var(--ink-3);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .list-amount {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;

  .list-amount.income { color: var(--sage-2); }

  .list-action {
    background: transparent;
    border: none;
    color: var(--ink-4);

    cursor: pointer;
    padding: 4px;

  .list-action:hover { color: var(--terracotta); }

  /* ===== CAT TREE ===== */
  .cat-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;

    height: 32px;
    border-radius: 50%;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;

  .cat-row .cat-name { flex: 1; font-size: 14px; color: var(--ink); font-weight: 500; }
  .cat-row .cat-tag {

    letter-spacing: 0.08em;

  .cat-row .cat-del {

    border: 1px solid var(--line-2);
    color: var(--ink-3);
    padding: 4px 10px;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: 11px;
    font-family: var(--font-mono);
    transition: all 0.15s ease;

  /* ===== PROGRESS (budgets) — hand-drawn feel ===== */

    height: 8px;
    background: var(--paper-2);
    border: 1px solid var(--line-2);
    border-radius: 100px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--ink);
    border-radius: 100px;
    transition: width 0.4s ease, background 0.2s ease;
  }
  .progress-fill.warn { background: var(--amber); }
  .progress-fill.over { background: var(--terracotta); }

  /* ===== MODAL — paper page flip ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(43,37,32,0.4);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    z-index: 100;
    align-items: flex-end;
    justify-content: center;
    padding: 0;
  }
  @media (min-width: 720px) {
    .modal-overlay { align-items: center; padding: 24px; }
  }
  .modal-overlay.open { display: flex; }
  .modal-overlay.open .modal {
    animation: modalIn 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(40px) rotate(-1deg); }
    to { opacity: 1; transform: translateY(0) rotate(0); }
  }
  .modal {
    background: var(--cream);
    border: 1.5px solid var(--ink);
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    box-shadow: 0 -4px 0 var(--ink), 0 -8px 32px rgba(43,37,32,0.25);
    width: 100%;
    max-width: 480px;
    max-height: 92vh;
    overflow-y: auto;
    padding: 24px 22px calc(24px + env(safe-area-inset-bottom));
    position: relative;
  }
  @media (min-width: 720px) {
    .modal { border-radius: var(--r-lg); box-shadow: 4px 4px 0 var(--ink), 0 8px 32px rgba(43,37,32,0.25); }
  }
  .modal::before {
    content: '';
    position: absolute;
    top: 0;
    left: 36px;
    bottom: 0;
    width: 1px;
    background: rgba(196,90,45,0.2);
    pointer-events: none;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding-bottom: 12px;
    border-bottom: 1.5px dashed var(--line-2);
    position: relative;
  }
  .modal-title {
    font-family: var(--font-hand);
    font-weight: 700;
    font-size: 28px;
    line-height: 1;
    color: var(--ink);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .modal-close {
    background: transparent;
    border: 1.5px solid var(--ink-3);
    color: var(--ink-2);
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }
  .modal-close:hover { background: var(--ink); color: var(--cream); }
  .modal-body { display: flex; flex-direction: column; gap: 16px; position: relative; }
  .modal-foot { display: flex; gap: 10px; margin-top: 12px; }
  .modal-foot .btn { flex: 1; }

  /* ===== TOAST — sticky note ===== */
  .toast {
    position: fixed;
    top: 16px;
    left: 50%;
    transform: translateX(-50%) translateY(-20px) rotate(-2deg);
    z-index: 200;
    padding: 10px 18px;
    background: var(--amber-soft);
    color: var(--ink);
    border: 1.5px solid var(--ink);
    border-radius: 2px;
    font-family: var(--font-hand);
    font-size: 18px;
    font-weight: 600;
    box-shadow: 3px 4px 0 var(--ink);
    pointer-events: none;
    opacity: 0;
    transition: all 0.3s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0) rotate(-1.5deg);
  }
  .toast.success { background: var(--sage-soft); }
  .toast.error { background: var(--terracotta-soft); color: var(--terracotta-2); }
  .toast.info { background: var(--amber-soft); }

  /* ===== SCREENS ===== */
  .screen { display: none !important; }
  .screen.active {
    display: block !important;
    animation: screenIn 0.32s ease;
  }
  @keyframes screenIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }

  /* ===== EMPTY STATE ===== */

  /* ===== SETTINGS GROUP ===== */

    font-family: var(--font-mono);
    font-size: 11px;

/* ===== LIVING MOLESKINE — animation layer ===== */

/* Balance ink-write: SVG overlay sits absolutely over text */
.balance-ink-wrap { position: relative; display: inline-block; }
.balance-ink-wrap > svg {
  position: absolute; inset: 0; pointer-events: none;
  width: 100%; height: 100%; overflow: visible;
}
.balance-ink-wrap > svg text {
  fill: none; stroke: var(--terracotta); stroke-width: 1.4;
  stroke-linecap: round; stroke-linejoin: round;
}

/* FAB idle breath + tap spring baseline */
.fab { will-change: transform; transform-origin: 50% 50%; }
.fab.is-rotated { transform: rotate(45deg); }

/* Modal 3D paper slide setup */
.modal-overlay { perspective: 1200px; }
.modal {
  transform-style: preserve-3d;
  will-change: transform, opacity;
}

/* Page-turn: out + in screens need 3D context.
   When GSAP boots, it sets body.lm-ready which suppresses the CSS screenIn keyframe
   so it doesn't fight with the JS-controlled rotateY. */
.screen {
  transform-style: preserve-3d;
  backface-visibility: hidden;
}
body.lm-ready .screen.active { animation: none !important; }
.screen.turning-out {
  position: absolute; inset: 0;
  transform-origin: left center;
  will-change: transform, opacity;
}
.screen.turning-in {
  transform-origin: left center;
  will-change: transform, opacity;
}

/* Nav indicator — sliding pill */
.bottom-nav-inner { position: relative; }
.nav-indicator {
  position: absolute;
  top: 2px; bottom: 2px;
  left: 2px;
  width: calc((100% - 4px) / 5);
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 8px;
  z-index: 0;
  pointer-events: none;
  box-shadow: 0 1px 0 rgba(0,0,0,0.04);
}
.nav-pill { position: relative; z-index: 1; }

/* New transaction slide-from-right target */
.tx-row-enter { opacity: 0; transform: translateX(20px); }

/* Progress bar fill baseline — GSAP overrides duration/ease */
.progress-bar { transition: none; }

/* Reduced-motion fallback: snap all motion to instant */
@media (prefers-reduced-motion: reduce) {
  .screen.turning-out, .screen.turning-in { transform: none !important; transition: opacity 0.15s linear; }
  .balance-ink-wrap > svg { display: none; }
  .fab { transition: none !important; animation: none !important; }
  * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
}

function cloneCategories() {

    income: DEFAULT_CATEGORIES.income.map(c => ({ ...c })),
    expense: DEFAULT_CATEGORIES.expense.map(c => ({ ...c })),
  };
}
function normalizeCategories(value) {
  const source = isRecord(value) ? value : {};
  const normalizeList = (items, fallback) => {
    if (!Array.isArray(items)) return fallback.map(c => ({ ...c }));
    const seen = new Set();
    const result = items.map(item => {
      if (!isRecord(item)) return null;
      const id = typeof item.id === 'string' ? item.id.trim() : '';
      const name = typeof item.name === 'string' ? item.name.trim() : '';
      const emoji = typeof item.emoji === 'string' ? item.emoji.trim() : '';
      if (!id || !name || seen.has(id)) return null;
      seen.add(id);
      return { id, name: name.slice(0, 60), emoji: (emoji || '📌').slice(0, 8) };
    }).filter(Boolean);
    return result.length ? result : fallback.map(c => ({ ...c }));
  };
  return {
    income: normalizeList(source.income, DEFAULT_CATEGORIES.income),
    expense: normalizeList(source.expense, DEFAULT_CATEGORIES.expense),
  };
}
function isCustomCatId(id) { return typeof id === 'string' && id.startsWith('custom_'); }
function dedupeCat(items) {
  const seen = new Set();
  const out = [];
  items.forEach(c => {
    if (!c || typeof c.id !== 'string' || !c.id.trim()) return;
    if (seen.has(c.id)) return;
    seen.add(c.id);
    out.push({ id: c.id.trim(), name: String(c.name || '').trim().slice(0, 60), emoji: String(c.emoji || '📌').trim().slice(0, 8) });
  });
  return out;
}
// Union local + remote categories so a stale gist / import never wipes user's custom cats.
// Order: defaults → local custom (preserves user order on this device) → remote custom.
function mergeCategories(local, remote) {
  const mergeList = (localList, remoteList, defaults) => {
    const localCustom = Array.isArray(localList) ? localList.filter(c => isCustomCatId(c && c.id)) : [];
    const remoteCustom = Array.isArray(remoteList) ? remoteList.filter(c => isCustomCatId(c && c.id)) : [];
    const defaultCustom = dedupeCat(defaults);
    // Remote values win for matching ids (so renames/emoji edits propagate).
    const valueById = new Map();
    defaultCustom.forEach(c => valueById.set(c.id, c));
    localCustom.forEach(c => valueById.set(c.id, c));
    remoteCustom.forEach(c => valueById.set(c.id, c));
    return dedupeCat([...defaultCustom, ...localCustom, ...remoteCustom]).map(c => valueById.get(c.id) || c);
  };
  return {
    income: mergeList(local && local.income, remote && remote.income, DEFAULT_CATEGORIES.income),
    expense: mergeList(local && local.expense, remote && remote.expense, DEFAULT_CATEGORIES.expense),
  };
}
function hasAnyCustomCats(value) {
  if (!isRecord(value)) return false;
  const lists = [].concat(value.income || [], value.expense || []);
  return lists.some(c => c && isCustomCatId(c.id));
}
function loadCategories() {
  CATEGORIES = normalizeCategories(readStoredJson(STORAGE_KEYS.categories));
  localStorage.setItem(STORAGE_KEYS.categories, JSON.stringify(CATEGORIES));
}
function restoreCustomCategoriesFromCloud() {
  // Last-ditch: gist may carry cats that localStorage lost (cleared cache, reset, fresh profile).
  // Only acts if local has NO custom cats and remote has some — never overwrites existing state.
  const cfg = (typeof getSyncConfig === 'function') ? getSyncConfig() : { token: '', gistId: '' };
  if (!cfg.token || !cfg.gistId) return Promise.resolve(false);
  if (hasAnyCustomCats(CATEGORIES)) return Promise.resolve(false);
  return gistApi('GET').then(gist => {
    const file = gist && gist.files && gist.files['finance-data.json'];
    if (!file || typeof file.content !== 'string') return false;
    let remote;
    try { remote = JSON.parse(file.content); } catch (e) { return false; }
    if (!remote || !isRecord(remote.categories)) return false;
    if (!hasAnyCustomCats(remote.categories)) return false;
    CATEGORIES = mergeCategories(CATEGORIES, remote.categories);
    saveCategories();
    return true;
  }).catch(() => false);
}

function catName(id) { const c = catById(id); return c ? `${c.emoji} ${c.name}` : `❓ ${id}`; }
function catEmoji(id) { const c = catById(id); return c ? c.emoji : '❓'; }

function normalizeTransactions(value) {
  if (!Array.isArray(value)) return [];
  const ids = new Set();
  return value.map(item => {
    if (!isRecord(item)) return null;
    const type = item.type === 'income' || item.type === 'expense' ? item.type : '';
    const amount = Number(item.amount);
    const category = typeof item.category === 'string' ? item.category.trim() : '';
    const date = new Date(item.createdAt);
    if (!type || !category || !Number.isFinite(amount) || amount <= 0 || !Number.isFinite(date.getTime())) return null;
    let id = typeof item.id === 'string' && item.id.trim() ? item.id.trim() : uuid();
    while (ids.has(id)) id = uuid();
    ids.add(id);
    return { id, type, amount, category, comment: typeof item.comment === 'string' ? item.comment.slice(0, 200) : '', createdAt: date.toISOString() };
  }).filter(Boolean);
}
function normalizeBudgets(value) {
  if (!Array.isArray(value)) return [];
  const seen = new Set();
  return value.map(item => {
    if (!isRecord(item)) return null;
    const category = typeof item.category === 'string' ? item.category.trim() : '';
    const limit = Number(item.limit);
    if (!category || seen.has(category) || !Number.isFinite(limit) || limit <= 0) return null;
    seen.add(category);
    return { category, limit };
  }).filter(Boolean);
}
function loadData() {

function subDays(d, n) { const r = new Date(d); r.setDate(r.getDate() - n); return r; }

function formatCurrency(n) { return Math.abs(n).toLocaleString('ru-RU', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function formatNumber(n) { return formatCurrency(n); }
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));
}
function formatDate(iso) { const d = new Date(iso); return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
function formatDateShort(iso) { const d = new Date(iso); return d.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }); }
function getMonthRange() { const now = new Date(); return { from: new Date(now.getFullYear(), now.getMonth(), 1), to: now }; }
function isToday(iso) { const d = new Date(iso); const t = new Date(); return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth() && d.getDate() === t.getDate(); }
function isThisWeek(iso) { const d = new Date(iso); const t = new Date(); const startOfWeek = new Date(t); startOfWeek.setDate(t.getDate() - t.getDay() + (t.getDay() === 0 ? -6 : 1)); startOfWeek.setHours(0,0,0,0); return d >= startOfWeek; }
function isThisMonth(iso) { const d = new Date(iso); const t = new Date(); return d.getFullYear() === t.getFullYear() && d.getMonth() === t.getMonth(); }

function getTransactionsInRange(from, to) {
  return transactions.filter(t => {
    const d = new Date(t.createdAt);
    return d >= from && d <= to;
  });
}

function getChartContext(id) {
  const canvas = document.getElementById(id);
  if (!canvas) return null;
  const parent = canvas.parentElement;
  let fallback = parent.querySelector('.chart-fallback');
  if (typeof Chart !== 'function') {
    canvas.hidden = true;
    if (!fallback) {
      fallback = document.createElement('p');
      fallback.className = 'chart-fallback text-xs text-gray-500 text-center';
      fallback.textContent = 'График доступен при подключении к интернету';
      fallback.style.padding = '2rem 0';
      parent.appendChild(fallback);
    }
    return null;
  }
  canvas.hidden = false;
  if (fallback) fallback.remove();
  return canvas.getContext('2d');
}

function renderDoughnutChart(allTx) {

    expenseByCat[t.category] = (expenseByCat[t.category] || 0) + t.amount;
  });
  const entries = Object.entries(expenseByCat).sort((a, b) => b[1] - a[1]);
  const labels = entries.map(([cat]) => catName(cat));

  doughnutChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels,
      datasets: [{ data, backgroundColor: colors.slice(0, data.length), borderColor: '#F4EFE6', borderWidth: 2, hoverOffset: 6 }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      cutout: '60%',
      plugins: {
        legend: { display: true, position: 'bottom', labels: { color: '#4A4339', padding: 10, font: { size: 10, family: 'JetBrains Mono' }, usePointStyle: true, pointStyle: 'rect', pointStyleWidth: 10, boxWidth: 10, boxHeight: 10 } },
        tooltip: { backgroundColor: '#F4EFE6', titleColor: '#4A4339', bodyColor: '#2B2520', borderColor: '#4A4339', borderWidth: 1, padding: 8, cornerRadius: 0, titleFont: { family: 'JetBrains Mono', weight: '700' }, bodyFont: { family: 'JetBrains Mono' }, callbacks: { label: ctx => ` ${ctx.label}: ${formatCurrency(ctx.raw)}` } }
      }

}

function renderLineChart() {
  if (lineChartInstance) {
    lineChartInstance.destroy();
    lineChartInstance = null;
  }
  const ctx = getChartContext('lineChart');
  if (!ctx) return;

  const days = [];
  const balances = [];
  const allSorted = [...transactions].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
  const now = new Date();
  const start = new Date(now);
  start.setHours(0, 0, 0, 0);
  start.setDate(start.getDate() - 29);
  let running = allSorted
    .filter(t => new Date(t.createdAt) < start)
    .reduce((sum, t) => sum + (t.type === 'income' ? t.amount : -t.amount), 0);
  let index = allSorted.findIndex(t => new Date(t.createdAt) >= start);
  if (index < 0) index = allSorted.length;

  for (let i = 0; i < 30; i++) {
    const day = new Date(start);
    day.setDate(start.getDate() + i);
    const end = new Date(day);
    end.setHours(23, 59, 59, 999);
    while (index < allSorted.length && new Date(allSorted[index].createdAt) <= end) {
      const transaction = allSorted[index++];
      running += transaction.type === 'income' ? transaction.amount : -transaction.amount;
    }
    days.push(day.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }));
    balances.push(running);
  }

  lineChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: days,
      datasets: [{
        label: 'BAL',
        data: balances,
        borderColor: '#4A4339',
        backgroundColor: 'rgba(255,176,0,0.10)',
        fill: true,
        tension: 0,
        stepped: 'before',
        pointRadius: 0,
        pointHoverRadius: 4,
        pointHoverBackgroundColor: '#2B2520',
        pointHoverBorderColor: '#4A4339',
        pointHoverBorderWidth: 1,
        borderWidth: 1.5,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { backgroundColor: '#F4EFE6', titleColor: '#4A4339', bodyColor: '#2B2520', borderColor: '#4A4339', borderWidth: 1, padding: 8, cornerRadius: 0, titleFont: { family: 'JetBrains Mono', weight: '700' }, bodyFont: { family: 'JetBrains Mono' }, callbacks: { label: ctx => ` BAL: ${formatCurrency(ctx.raw)}` } }
      },
      scales: {
        x: { grid: { color: 'rgba(43,37,32,0.08)' }, border: { color: '#4A4339' }, ticks: { color: '#7A6F5F', maxTicksLimit: 7, font: { size: 9, family: 'JetBrains Mono' } } },
        y: { grid: { color: 'rgba(43,37,32,0.08)' }, border: { color: '#4A4339' }, ticks: { color: '#7A6F5F', font: { size: 9, family: 'JetBrains Mono' }, callback: v => Math.round(v/1000) + 'k' } }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

let barChartInstance = null, analDoughnutExpenseInstance = null, analDoughnutIncomeInstance = null;
let currentPeriod = 'all';

function getPeriodRange() {
  const now = new Date();
  const dateFrom = document.getElementById('analDateFrom').value;
  const dateTo = document.getElementById('analDateTo').value;
  let from;
  let to;
  if (dateFrom || dateTo) {
    from = dateFrom ? new Date(dateFrom + 'T00:00:00') : new Date(0);
    to = dateTo ? new Date(dateTo + 'T23:59:59') : now;
    if (from > to) [from, to] = [to, from];
  } else {
    switch (currentPeriod) {
      case 'week': from = new Date(now); from.setDate(from.getDate() - 6); from.setHours(0,0,0,0); to = now; break;
      case 'year': from = new Date(now.getFullYear(), 0, 1); to = now; break;
      case 'month': from = new Date(now.getFullYear(), now.getMonth(), 1); to = now; break;
      default: from = new Date(0); to = now;
    }
  }
  return { from, to };
}

function renderAnalytics() {
  const { from, to } = getPeriodRange();
  const rangeTx = transactions.filter(t => {
    const d = new Date(t.createdAt);
    return d >= from && d <= to;
  });

  const totalIncome = rangeTx.filter(t => t.type === 'income').reduce((s, t) => s + t.amount, 0);
  const totalExpense = rangeTx.filter(t => t.type === 'expense').reduce((s, t) => s + t.amount, 0);
  const net = totalIncome - totalExpense;
  const avg = rangeTx.length > 0 ? (totalIncome + totalExpense) / rangeTx.length : 0;
  const count = rangeTx.length;

  document.getElementById('analSum').textContent = (net >= 0 ? '' : '−') + formatCurrency(Math.abs(net));
  document.getElementById('analAvg').textContent = formatCurrency(avg);
  document.getElementById('analCount').textContent = count;

  renderBarChart(rangeTx, from, to);
  renderAnalDoughnutEx(rangeTx);
  renderAnalDoughnutIn(rangeTx);
  renderTop5(rangeTx);
}

function renderBarChart(rangeTx, from, to) {
  if (barChartInstance) {
    barChartInstance.destroy();
    barChartInstance = null;
  }
  const ctx = getChartContext('barChart');
  if (!ctx) return;

  const diffDays = Math.max(1, Math.round((to - from) / (1000 * 60 * 60 * 24)));
  let labels;
  let incomeData;
  let expenseData;

  if (diffDays <= 31) {
    const dayKeys = [];
    for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) {
      const day = new Date(d);
      day.setHours(0, 0, 0, 0);
      dayKeys.push(day);
    }
    labels = dayKeys.map(day => day.toLocaleDateString('ru-RU', { day: '2-digit', month: 'short' }));
    incomeData = dayKeys.map(() => 0);
    expenseData = dayKeys.map(() => 0);
    rangeTx.forEach(t => {
      const date = new Date(t.createdAt);
      const idx = dayKeys.findIndex(day => date.getFullYear() === day.getFullYear() && date.getMonth() === day.getMonth() && date.getDate() === day.getDate());
      if (idx >= 0) {
        if (t.type === 'income') incomeData[idx] += t.amount;
        else expenseData[idx] += t.amount;
      }
    });
  } else {
    const monthly = new Map();
    rangeTx.forEach(t => {
      const date = new Date(t.createdAt);
      const key = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      if (!monthly.has(key)) monthly.set(key, {
        label: date.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' }),
        date: new Date(date.getFullYear(), date.getMonth(), 1),
        income: 0,
        expense: 0,
      });
      const month = monthly.get(key);
      if (t.type === 'income') month.income += t.amount;
      else month.expense += t.amount;
    });
    const months = [...monthly.values()].sort((a, b) => a.date - b.date);
    labels = months.map(month => month.label);
    incomeData = months.map(month => month.income);
    expenseData = months.map(month => month.expense);
  }

  barChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Доход', data: incomeData, backgroundColor: '#5B7553', borderRadius: 0, borderSkipped: false, maxBarThickness: 30, borderColor: '#5B7553', borderWidth: { top: 1, right: 1, left: 1, bottom: 0 } },
        { label: 'Расход', data: expenseData, backgroundColor: '#C45A2D', borderRadius: 0, borderSkipped: false, maxBarThickness: 30, borderColor: '#C45A2D', borderWidth: { top: 1, right: 1, left: 1, bottom: 0 } },
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'bottom', labels: { color: '#4A4339', padding: 14, font: { size: 11, family: 'JetBrains Mono' }, usePointStyle: true, pointStyle: 'rect' } },
        tooltip: { backgroundColor: '#F4EFE6', titleColor: '#4A4339', bodyColor: '#2B2520', borderColor: '#4A4339', borderWidth: 1, padding: 8, cornerRadius: 0, titleFont: { family: 'JetBrains Mono', weight: '700' }, bodyFont: { family: 'JetBrains Mono' }, callbacks: { label: ctx => ` ${ctx.dataset.label} ${formatCurrency(ctx.raw)}` } }
      },
      scales: {
        x: { stacked: false, grid: { display: false }, border: { color: '#4A4339' }, ticks: { color: '#7A6F5F', font: { size: 9, family: 'JetBrains Mono' }, maxTicksLimit: 12 } },
        y: { stacked: false, grid: { color: 'rgba(43,37,32,0.08)' }, border: { color: '#4A4339' }, ticks: { color: '#7A6F5F', font: { size: 9, family: 'JetBrains Mono' }, callback: v => Math.round(v/1000) + 'k' } }
      },
      interaction: { intersect: false, mode: 'index' }
    }
  });
}

function renderBudgets() {
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const spentByCat = {};
  transactions.filter(t => t.type === 'expense').forEach(t => {
    const d = new Date(t.createdAt);
    if (d >= monthStart && d <= now) spentByCat[t.category] = (spentByCat[t.category] || 0) + t.amount;
  });

  const container = document.getElementById('budgetList');
  if (budgets.length === 0) {
    container.innerHTML = '<div style="text-align: center; padding: 2.5rem 1rem; color: var(--amber-dim); font-family: JetBrains Mono, monospace; font-size: 11px">Лимиты ещё не заданы</div>';
    return;
  }
  const bar = (pct, w) => '█'.repeat(Math.round(pct / 100 * w)) + '░'.repeat(w - Math.round(pct / 100 * w));
  container.innerHTML = budgets.map(b => {
    const spent = spentByCat[b.category] || 0;
    const pct = Math.min(100, Math.round(spent / b.limit * 100));
    const over = spent > b.limit;
    const fillColor = over ? 'var(--crimson)' : pct > 80 ? 'var(--amber-bright)' : 'var(--mint)';
    const name = (catById(b.category)?.name || b.category).toUpperCase();
    return `<div class="budget-card ${over ? 'over' : ''}">
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.4rem">
          <span style="font: 600 12px 'JetBrains Mono', monospace; color: var(--amber); letter-spacing: 0.04em">&gt; ${escapeHtml(name)}</span>
          <button data-delete-budget="${escapeHtml(b.category)}" style="font: 600 9px 'JetBrains Mono', monospace; color: var(--amber-dim); background: transparent; border: 1px solid var(--amber-dim); padding: 1px 5px; cursor: pointer; text-transform: uppercase">[ DEL ]</button>
        </div>
        <div style="display: flex; justify-content: space-between; font-size: 11px; color: var(--amber-dim); margin-bottom: 0.3rem; font-family: 'JetBrains Mono', monospace">
          <span style="color: ${fillColor}">SPENT: ${formatCurrency(spent)}</span>
          <span>LIMIT: ${formatCurrency(b.limit)}</span>
        </div>
        <div class="ascii-bar" style="color: ${fillColor}">[${bar(pct, 30)}] ${String(pct).padStart(3, ' ')}%</div>
        ${over ? `<div style="font: 600 10px 'JetBrains Mono', monospace; color: var(--crimson); margin-top: 0.4rem; letter-spacing: 0.05em">! OVERRUN BY ${formatCurrency(spent - b.limit)}</div>` : ''}
      </div>`;
  }).join('');
}

function validateDataPayload(value) {
  if (!isRecord(value)) throw new Error('Файл должен содержать объект');
  const payload = {};
  if (Object.prototype.hasOwnProperty.call(value, 'transactions')) {
    if (!Array.isArray(value.transactions)) throw new Error('Некорректные транзакции');
    payload.transactions = normalizeTransactions(value.transactions);
  }
  if (Object.prototype.hasOwnProperty.call(value, 'budgets')) {
    if (!Array.isArray(value.budgets)) throw new Error('Некорректные бюджеты');
    payload.budgets = normalizeBudgets(value.budgets);
  }
  if (Object.prototype.hasOwnProperty.call(value, 'categories')) {
    if (!isRecord(value.categories)) throw new Error('Некорректные категории');
    payload.categories = normalizeCategories(value.categories);
  }
  if (Object.keys(payload).length === 0) throw new Error('В файле нет данных');
  return payload;
}
function applyDataPayload(value, pushAfter = false) {
  const payload = validateDataPayload(value);
  const shouldPush = pushAfter && syncWritesEnabled;
  const previousSyncState = syncWritesEnabled;
  syncWritesEnabled = false;
  try {
    if (Object.prototype.hasOwnProperty.call(payload, 'transactions')) {
      transactions = payload.transactions;
      saveData();
    }
    if (Object.prototype.hasOwnProperty.call(payload, 'budgets')) {
      budgets = payload.budgets;
      saveBudgets();
    }
    if (Object.prototype.hasOwnProperty.call(payload, 'categories')) {
      CATEGORIES = mergeCategories(CATEGORIES, payload.categories);
      saveCategories();
    }
  } finally {
    syncWritesEnabled = previousSyncState;
  }
  if (shouldPush) autoPushGist();
}
function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      applyDataPayload(JSON.parse(e.target.result), true);
      showToast('Данные импортированы!', 'success');
      refreshAll();
    } catch (err) {
      showToast('Ошибка импорта: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ==================== GITHUB GIST SYNC ====================
function getSyncConfig() {
  const stored = readStoredJson(STORAGE_KEYS.syncConfig);
  const legacyToken = isRecord(stored) && typeof stored.token === 'string' ? stored.token.trim() : '';
  const token = sessionStorage.getItem(STORAGE_KEYS.syncToken) || legacyToken;
  const gistIdValue = isRecord(stored) ? stored.gistId : '';
  const gistId = typeof gistIdValue === 'string' && /^[A-Za-z0-9_-]+$/.test(gistIdValue.trim()) ? gistIdValue.trim() : '';
  if (legacyToken) {
    sessionStorage.setItem(STORAGE_KEYS.syncToken, legacyToken);
    localStorage.setItem(STORAGE_KEYS.syncConfig, JSON.stringify({ gistId }));
  }
  return { token, gistId };
}
function saveSyncSettings() {
  const token = document.getElementById('syncToken').value.trim();
  const gistId = document.getElementById('syncGistId').value.trim();
  if (!token || !/^[A-Za-z0-9_-]+$/.test(gistId)) { showToast('Заполни корректные данные', 'error'); return; }
  sessionStorage.setItem(STORAGE_KEYS.syncToken, token);

      from.style.transform = '';
      from.style.opacity = '';
    }});

    tl.to(from, { rotateY: -8, opacity: 0.4, duration: 0.28, ease: 'power2.in' }, 0);
    tl.to(to, { rotateY: 0, opacity: 1, x: 0, duration: 0.32, ease: 'power3.out' }, 0.06);
  }

  // ---------- Bottom nav indicator ----------
  let navIndicator = null;
  function slideNavIndicator(targetPill) {
    const navInner = document.querySelector('.bottom-nav-inner');
    if (!navInner) return;
    if (!navIndicator) {
      navIndicator = document.createElement('div');
      navIndicator.className = 'nav-indicator';
      navInner.appendChild(navIndicator);
      // Place initially on active pill without animation
      const active = navInner.querySelector('.nav-pill.active');
      if (active) {
        const idx = Array.prototype.indexOf.call(navInner.querySelectorAll('.nav-pill'), active);
        navIndicator.style.transform = 'translateX(' + (idx * active.offsetWidth) + 'px)';
      }
      return;
    }
    if (!targetPill) return;
    const pills = navInner.querySelectorAll('.nav-pill');
    const idx = Array.prototype.indexOf.call(pills, targetPill);
    if (idx < 0) return;
    const targetX = idx * targetPill.offsetWidth;
    gsap.to(navIndicator, { x: targetX, duration: 0.4, ease: 'back.out(1.4)' });
  }

  // ---------- New transaction slide-from-right ----------
  function enterTxRow(el) {
    if (!el) return;
    gsap.fromTo(el,
      { x: 20, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.32, ease: 'power2.out' }
    );
  }

  // ---------- Progress bar fill ----------
  function fillProgress(bar, targetPct) {
    if (!bar) return;
    gsap.fromTo(bar,
      { width: '0%' },
      { width: targetPct + '%', duration: 0.8, ease: 'back.out(1.2)' }
    );
  }

  // ---------- Public API ----------
  window.__lm = {
    mountDashboard: mountDashboard,
    inkWrite: function (el) { inkWrite(el); },
    startFabBreath: startFabBreath,
    pauseFabBreath: pauseFabBreath,
    resumeFabBreath: resumeFabBreath,
    tapFab: tapFab,
    rotateFab: rotateFab,
    openModalAnim: openModalAnim,
    closeModalAnim: closeModalAnim,
    turnPage: turnPage,
    slideNavIndicator: slideNavIndicator,
    tweenNumber: tweenNumber,
    enterTxRow: enterTxRow,
    fillProgress: fillProgress,
  };

  // Auto-start FAB breath and nav indicator when DOM ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      startFabBreath();
      slideNavIndicator();
    });
  } else {
    startFabBreath();
    slideNavIndicator();
  }
}
if (document.readyState === 'complete') { __lmInit(); }
else { window.addEventListener('load', __lmInit); }
</script>
</body>
</html>
